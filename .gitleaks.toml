# The default rules, plus two rules and two allowlists for the EpT register of interests
# (#44). The EpT rules cover only the EpT data and fixtures: the AR files elsewhere in
# data/ hold thousands of 9-digit ids, sizes and counts.
[extend]
useDefault = true

# A number outside the company NIPC prefixes (5, 6, 71, 72, 79) can identify a person and
# is never stored, in any column: 1 to 4, 8 (old sole traders), 9x (condominiums,
# irregular companies, sole traders' estates), 0 and the other 7x prefixes, 77 included.
[[rules]]
id = "ept-personal-nif"
description = "9 digits outside the company NIPC prefixes in the EpT data"
regex = '''(?:^|[^0-9])((?:[0-489][0-9]|7[03-8])[0-9]{7})(?:[^0-9]|$)'''
secretGroup = 1
path = '''(?:^|/)(?:data/ept_registo_interesses|tests/fixtures/ept)/'''

# No 9-digit value is stored, except a company NIPC in a tab 4 NIPC column (allowlist
# below). The check digit is checked by the tests (ept.assert_clean), not here.
[[rules]]
id = "ept-nine-digits"
description = "9 digits in the EpT data outside the NIPC column"
regex = '''(?:^|[^0-9])([0-9]{9})(?:[^0-9]|$)'''
secretGroup = 1
path = '''(?:^|/)(?:data/ept_registo_interesses|tests/fixtures/ept)/'''

[[allowlists]]
description = "a company NIPC alone on a tab 4 NIPC column line of a pretty-printed declaration"
targetRules = ["ept-nine-digits"]
regexTarget = "line"
regexes = ['''^\s*"col[679]": "(?:[56][0-9]{8}|7[129][0-9]{7})",?\s*$''']

# The EpT tab 4 section, row and column keys (for example
# "2c6d9562-dea5-488b-9afe-42519c636daf-col1") are public form GUIDs that the
# generic-api-key rule reads as secrets.
[[allowlists]]
description = "EpT tab 4 form GUIDs"
regexTarget = "secret"
regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(_\d+|-col\d+)?$''']

# The AR open data under data/ is public, generated by the data sync, and makes up most of
# the 2.3 GB history. Skip it for every rule, defaults included. A data/ directory whose
# name starts with ept_ is still scanned, so the EpT rules above keep guarding
# data/ept_registo_interesses/. Go regexes have no lookahead, so the pattern spells out
# "a first path segment that does not start with ept_".
[[allowlists]]
description = "AR open data under data/, everything except data/ept_*/"
paths = ['''^data/(?:e|ep|ept|(?:[^e/]|e[^p/]|ep[^t/]|ept[^_/])[^/]*)/''']

# A source key such as "intervencoes/XVII" (dataset/legislature) in test code reads as a
# generic API key when it is assigned to a name ending in key. It is never a secret.
[[allowlists]]
description = "dataset/legislature source keys"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^[a-z_]+/(?:[IVX]+(?:-[AB])?|Constituinte)$''']
