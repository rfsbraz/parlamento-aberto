name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  dictionary:
    name: data dictionary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Check docs/dictionary is up to date with schema.yml
        run: uv run python -m parlamento_aberto.dictionary --check

  # Scans only the commits the PR adds. The full history is scanned weekly on main
  # (gitleaks-full.yml).
  gitleaks:
    name: gitleaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      # Every commit but no file contents up front: git fetches the blobs base..head
      # needs when gitleaks reads the diff. Only .gitleaks.toml is checked out.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .gitleaks.toml
          sparse-checkout-cone-mode: false
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  file-size:
    name: file size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_file_size.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint (with shellcheck)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
