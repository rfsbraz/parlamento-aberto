# Version of the published schema, in manifest.json. Bump the major on a breaking change
# (a column removed or renamed, a type changed); the site refuses an unknown major.
schema_version: "1.0.0"

# Every model, in run order, with a description of every column.
# The data dictionary in docs/dictionary is generated from this file
# (uv run python -m parlamento_aberto.dictionary). An optional quirks list on a model
# goes on its page, for example where the JSON disagrees with the old mappers.
# Descriptions are in pt-PT (#59); keys, model and column names stay in English.
models:
  seed_seats:
    description: >-
      Lugares na Assembleia da República por legislatura, mantidos à mão, cada linha com a sua
      fonte. Constituinte é a Assembleia Constituinte de 1975-1976, com 250 lugares. A legislatura I está dividida como nas pastas da AR: I-A (desde 1976, 263 lugares) e
      I-B (desde as eleições intercalares de dezembro de 1979, 250 lugares), com a mesma fonte.
    columns:
      legislature: Legislatura em numeração romana, como nos nomes das pastas da AR, por exemplo XVII ou I-A.
      seats: Número total de lugares nessa legislatura.
      source: Origem do número de lugares.

  stg_informacao_base__legislatures:
    description: InformacaoBase DetalheLegislatura, uma linha por ficheiro de legislatura.
    columns:
      legislature_id: Id interno da legislatura na AR (id).
      start_date: Primeiro dia da legislatura (dtini).
      end_date: Último dia da legislatura (dtfim), nulo enquanto está em curso.
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_informacao_base__sessions:
    description: InformacaoBase SessoesLegislativas, uma linha por sessão legislativa.
    columns:
      session_number: Número da sessão dentro da legislatura (numSessao).
      start_date: Primeiro dia da sessão (dataInicio).
      end_date: Último dia da sessão (dataFim).
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_informacao_base__electoral_circles:
    description: InformacaoBase CirculosEleitorais, uma linha por círculo eleitoral.
    columns:
      circle_id: Id do círculo eleitoral na AR (cpId).
      name: Nome do círculo eleitoral (cpDes).
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_informacao_base__parliamentary_groups:
    description: InformacaoBase GruposParlamentares, uma linha por grupo parlamentar.
    columns:
      group_acronym: Sigla do grupo (sigla), por exemplo PS.
      name: Nome completo do partido ou grupo (nome).
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_informacao_base__deputies:
    description: InformacaoBase Deputados, uma linha por pessoa nas listas de uma legislatura, eleita ou não.
    columns:
      cadastro_id: Id da pessoa, comum a todas as legislaturas e conjuntos de dados (DepCadId).
      deputy_id: Id desta pessoa nesta legislatura (DepId).
      full_name: Nome completo (DepNomeCompleto).
      parliamentary_name: Nome usado no parlamento (DepNomeParlamentar).
      circle_id: Círculo eleitoral por onde a pessoa concorreu (DepCPId).
      circle_name: Nome desse círculo eleitoral (DepCPDes).
      situations: Períodos de situação (DepSituacao) como situation, start_date, end_date.
      groups: Filiações em grupos (DepGP) como group_id, group_acronym, start_date, end_date.
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_registo_biografico__biographies:
    description: >-
      RegistoBiografico, uma linha por registo de pessoa, só campos escalares. II e III vêm
      dos ficheiros mais antigos em formato XML listados na página I Legislatura da AR (chaves
      em camelCase), e Constituinte do RegistoBiograficoConstituinte.xml mais antigo, no mesmo
      formato. As outras páginas são cópias mais antigas do registo da XVII e não são guardadas,
      exceto a I (335 pessoas), pelo que as linhas da I não são os deputados dessa legislatura
      (docs/known-gaps.md).
    columns:
      cadastro_id: Id da pessoa, comum a todas as legislaturas e conjuntos de dados (CadId).
      full_name: Nome completo (CadNomeCompleto).
      birth_date: Data de nascimento (CadDtNascimento).
      sex: Sexo tal como publicado pela AR, M ou F (CadSexo).
      profession: Profissão (CadProfissao).
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  legislatures:
    description: Uma linha por legislatura.
    columns:
      legislature: Legislatura em numeração romana, por exemplo XVII.
      legislature_id: Id interno da legislatura na AR.
      start_date: Primeiro dia da legislatura.
      end_date: Último dia da legislatura, nulo enquanto está em curso.
      extract_date: Data da extração da AR, tirada da data de fim que a AR escreve nas filiações em grupos ainda abertas.

  sessions:
    description: Uma linha por sessão legislativa.
    columns:
      legislature: Legislatura em numeração romana.
      session_number: Número da sessão dentro da legislatura.
      start_date: Primeiro dia da sessão.
      end_date: Último dia da sessão.

  electoral_circles:
    description: Uma linha por círculo eleitoral e por legislatura.
    columns:
      legislature: Legislatura em numeração romana.
      circle_id: Id do círculo eleitoral na AR.
      name: Nome do círculo eleitoral.

  parliamentary_groups:
    description: Uma linha por grupo parlamentar e por legislatura.
    columns:
      legislature: Legislatura em numeração romana.
      group_acronym: Sigla do grupo, por exemplo PS.
      name: Nome completo do partido ou grupo.

  seed_coalitions:
    description: >-
      Lista mantida à mão das coligações eleitorais que elegeram deputados, uma linha por
      legislatura, lista da coligação e grupo parlamentar correspondente, cada linha com a sua
      fonte. Partiu do antigo coalition_detector.py, mantendo só as coligações que elegeram
      deputados e os grupos que existem em parliamentary_groups.
    columns:
      legislature: Legislatura em numeração romana (o nome da pasta de dados) preenchida pela eleição.
      coalition: Nome curto pelo qual a coligação é conhecida, por exemplo AD ou CDU.
      ballot_acronym: Sigla da lista no boletim de voto, por exemplo PCP-PEV ou PPD/PSD.CDS-PP.
      coalition_name: Nome da lista da coligação.
      group_code: Grupo parlamentar onde os seus deputados se sentaram, como listado em parliamentary_groups nessa legislatura.
      source_url: Referência para a composição da coligação.
      election_url: Página da CNE sobre a eleição, com o mapa oficial de resultados.
      note: Exceções, por exemplo círculos onde os partidos concorreram separados.

  coalitions:
    description: >-
      Uma linha por legislatura, lista da coligação e grupo parlamentar, a partir de seed_coalitions.
      Serve para ler resultados por grupo: por exemplo, a AD na XVII senta-se como PSD e CDS-PP, e a CDU
      como PCP (e PEV até à XIV). Os partidos que concorreram sozinhos não constam.
    columns:
      legislature: Legislatura em numeração romana.
      coalition: Nome curto pelo qual a coligação é conhecida, por exemplo AD ou CDU.
      ballot_acronym: Sigla da lista no boletim de voto.
      coalition_name: Nome da lista da coligação.
      group_code: Grupo parlamentar, liga a parliamentary_groups por legislature e group_acronym.
      group_name: Nome desse grupo em parliamentary_groups.
      source_url: Referência para a composição da coligação.
      election_url: Página da CNE sobre a eleição, com o mapa oficial de resultados.
      note: Exceções, por exemplo círculos onde os partidos concorreram separados.

  deputies:
    description: Uma linha por pessoa (cadastro_id) que aparece em qualquer lista, eleita ou não. Use mandates para saber quem teve lugar e quando.
    columns:
      cadastro_id: Id da pessoa, comum a todas as legislaturas e conjuntos de dados.
      full_name: Nome completo, do RegistoBiografico quando existe, senão da InformacaoBase mais recente.
      parliamentary_name: Nome usado no parlamento, da legislatura mais recente em que a pessoa aparece.
      sex: Sexo tal como publicado pela AR, M ou F. Nulo sem registo no RegistoBiografico.
      birth_date: Data de nascimento. Nulo sem registo no RegistoBiografico.
      profession: Profissão. Nulo sem registo no RegistoBiografico.
      biography_legislature: >-
        Legislatura do registo do RegistoBiografico de onde vêm os campos biográficos, a mais
        recente para a pessoa. Só há biografias reais por legislatura para a Constituinte, a II e
        a III; a XVII é o registo atual. Nulo sem registo no RegistoBiografico.

  mandates:
    description: >-
      Uma linha por deputado, legislatura e período de situação (DepSituacao), tal como publicado.
      Quem tinha lugar no dia D é a consulta seated_on(D), não uma coluna; seated_during(D0, D1)
      dá o mesmo para cada dia de um intervalo, e os marts de votações usam-na. Os períodos da AR
      de uma pessoa podem sobrepor-se num dia de passagem, por exemplo um período Efetivo e um
      Suspenso que cobrem o mesmo dia. A regra: entre os períodos de uma pessoa que cobrem D,
      ganha o que começa mais tarde; em caso de empate, ganha o mais longo (um fim em aberto conta
      como o mais longo); e, com as duas datas empatadas, ganha o efetivo. A pessoa tem lugar se
      esse período for Efetivo, Efetivo Temporário ou Efetivo Definitivo. Num dia de troca, quando
      um círculo tem mais deputados em D do que em D - 1 e em D + 1, os períodos efetivos que
      terminam em D (sem período efetivo da mesma pessoa a começar em D + 1) não contam, até esse
      excesso e ao número de pessoas que começam um lugar em D. As contagens da Constituinte à VI
      continuam sobrestimadas em muitos dias, ver docs/known-gaps.md.
    quirks:
      - >-
        A InformacaoBase lista todas as pessoas nas listas de uma legislatura, eleitas ou não: 1446 pessoas na XVII na sincronização de 20 de outubro de 2026, para 230 lugares. Conte os lugares a partir dos períodos is_effective que cobrem uma data, não a partir das linhas das listas. O site antigo contava cada registo como um deputado.
    columns:
      legislature: Legislatura em numeração romana.
      cadastro_id: Id da pessoa, liga a deputies.
      deputy_id: Id desta pessoa nesta legislatura.
      circle_id: Círculo eleitoral por onde a pessoa concorreu, liga a electoral_circles.
      situation: Situação tal como publicada, por exemplo Efetivo, Suplente, Suspenso(Eleito).
      is_effective: Verdadeiro para Efetivo, Efetivo Temporário e Efetivo Definitivo, as situações que ocupam um lugar.
      start_date: Primeiro dia da situação.
      end_date: Último dia da situação, nulo enquanto está aberta.

  group_memberships:
    description: Uma linha por deputado, legislatura e período num grupo parlamentar (DepGP).
    quirks:
      - >-
        A AR escreve a data da extração como data de fim de uma filiação aberta. O mapeador antigo guardava essa data tal como publicada, pelo que as filiações abertas pareciam fechadas. Aqui uma filiação aberta tem end_date nulo e is_open = true.
    columns:
      legislature: Legislatura em numeração romana.
      cadastro_id: Id da pessoa, liga a deputies.
      group_id: Id do grupo na AR nesta legislatura (gpId).
      group_acronym: Sigla do grupo, liga a parliamentary_groups.
      start_date: Primeiro dia no grupo.
      end_date: Último dia no grupo, nulo enquanto a filiação está aberta.
      is_open: Verdadeiro quando a legislatura está em curso e a data de fim da AR é igual ou posterior à data da extração.

  stg_iniciativas__initiatives:
    description: Iniciativas, uma linha por registo de iniciativa.
    columns:
      initiative_id: Id da iniciativa na AR (IniId).
      number: Número da iniciativa dentro do seu tipo e legislatura (IniNr).
      type_code: Código do tipo de iniciativa (IniTipo), por exemplo J.
      type: Tipo de iniciativa (IniDescTipo), por exemplo Projeto de Lei.
      session_number: Sessão legislativa em que a iniciativa deu entrada (IniSel).
      title: Título (IniTitulo).
      text_url: Ligação para o texto da iniciativa (IniLinkTexto).
      author_kind_code: Código do tipo de autor (IniAutorOutros.sigla), por exemplo D, G ou V.
      author_kind: Tipo de autor (IniAutorOutros.nome), por exemplo Deputados, Grupos Parlamentares ou Governo.
      author_committee: Comissão autora da iniciativa, quando o autor é uma comissão (IniAutorOutros.iniAutorComissao).
      author_deputies: Deputados autores (IniAutorDeputados) como cadastro_id, name, group_acronym.
      author_groups: Grupos autores (IniAutorGruposParlamentares) como siglas de grupos.
      events: Eventos (IniEventos) como event_id, phase, phase_date, as votações em plenário em bruto (Votacao) e as comissões (Comissao) como committee_id, committee_name e as suas votações em bruto.
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_iniciativas__votes:
    description: Uma linha por registo de votação (Votacao) num evento de uma iniciativa. Uma votação sobre várias iniciativas aparece uma vez por iniciativa.
    columns:
      vote_id: Id da votação na AR (id).
      initiative_id: Iniciativa em que o registo é publicado.
      event_id: Evento a que a votação pertence (EvtId).
      phase: Fase desse evento (Fase), por exemplo Votação na generalidade.
      phase_date: Data desse evento (DataFase).
      date: Data da votação (data).
      result: Resultado tal como publicado (resultado), por exemplo Aprovado ou Rejeitado.
      meeting: Número da reunião (reuniao).
      meeting_type: Código do tipo de reunião (tipoReuniao), RP para uma reunião plenária.
      unanimous: Verdadeiro quando a AR marca a votação como unânime (unanime), senão falso.
      description: Descrição do que foi votado (descricao).
      detail: Quem votou em que sentido (detalhe), nulo quando ausente ou vazio.
      absent_groups: Grupos indicados como ausentes (ausencias).
      legislature: Legislatura da iniciativa, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_atividades__votes:
    description: Uma linha por registo de votação (VotacaoDebate) numa atividade em Atividades AtividadesGerais, como um voto de pesar ou uma moção.
    columns:
      vote_id: Id da votação na AR (id).
      activity_type: Código do tipo de atividade (Tipo), por exemplo VOT ou MOC.
      activity_type_description: Tipo de atividade (DescTipo).
      activity_number: Número da atividade (Numero).
      activity_subject: Assunto da atividade (Assunto).
      date: Data da votação (data).
      result: Resultado tal como publicado (resultado).
      meeting: Número da reunião (reuniao).
      meeting_type: Código do tipo de reunião (tipoReuniao).
      unanimous: Verdadeiro quando a AR marca a votação como unânime (unanime), senão falso.
      description: Descrição do que foi votado (descricao).
      detail: Quem votou em que sentido (detalhe), nulo quando ausente ou vazio.
      absent_groups: Grupos indicados como ausentes (ausencias).
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_iniciativas__committee_votes:
    description: Uma linha por registo de votação em comissão (Votacao dentro de IniEventos[].Comissao[]).
    columns:
      vote_id: Id da votação na AR (id). Os ids das votações em comissão não se sobrepõem aos do plenário.
      initiative_id: Iniciativa em que o registo é publicado.
      event_id: Evento a que pertence a entrada da comissão (EvtId).
      phase: Fase desse evento (Fase).
      phase_date: Data desse evento (DataFase).
      committee_id: Id da comissão na AR (IdComissao), o mesmo id que idOrgao em ComposicaoOrgaos.
      committee_name: Nome da comissão (Nome), sem espaços nas pontas.
      date: Data da votação (data).
      result: Resultado tal como publicado (resultado).
      meeting: Número da reunião da comissão (reuniao).
      unanimous: Verdadeiro quando a AR marca a votação como unânime (unanime), senão falso.
      description: Descrição do que foi votado (descricao), por exemplo MAIORIA ou ARTIGO A ARTIGO.
      detail: Quem votou em que sentido (detalhe), nulo quando ausente ou vazio.
      absent_groups: Grupos indicados como ausentes (ausencias).
      legislature: Legislatura da iniciativa, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_composicao_orgaos__committee_members:
    description: ComposicaoOrgaos Comissoes, uma linha por registo de membro de uma comissão (HistoricoComposicao).
    columns:
      committee_id: Id da comissão na AR (DetalheOrgao.idOrgao).
      committee_name: Nome da comissão (DetalheOrgao.nomeSigla), sem espaços nas pontas.
      cadastro_id: Id da pessoa (depCadId), liga a deputies.
      situations: Períodos como membro (depSituacao) como status (sioDes, Ativo ou Inativo), membership (sioTipMem, Efetivo ou Suplente), start_date, end_date.
      groups: Períodos em grupos (depGP) como group_acronym, start_date, end_date. Um período aberto tem data de fim nula.
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_votes__detail_items:
    description: >-
      Construído em Python pelo parser das votações. Uma linha por item em cada texto de detalhe
      distinto, ou uma linha com um erro quando o parser rejeita o texto.
    columns:
      detail: O texto do detalhe, liga à coluna detail dos modelos de votações.
      item_number: Posição do item no texto, a partir de 1. 0 numa linha de erro.
      kind: group (um grupo inteiro), count (um número de deputados de um grupo, como em 2-PS) ou deputy (um deputado nomeado).
      group_acronym: Código do grupo tal como escrito no texto.
      position: favour, against, abstention ou absent (a favor, contra, abstenção ou ausente).
      deputies: Num item count, o número de deputados.
      name: Num item deputy, o nome tal como escrito no texto.
      error: Porque é que o parser rejeitou o texto, nulo quando foi lido.

  seed_group_aliases:
    description: >-
      Aliases mantidos à mão para códigos de grupo que a AR escreve de forma diferente dentro
      de uma legislatura, cada linha com a sua fonte. Os marts guardam o código publicado em
      group_code_raw e põem em group_code o código do alias, ou o publicado quando não se aplica
      nenhum alias.
    columns:
      legislature: Legislatura em numeração romana (o nome da pasta de dados, por exemplo I-B) a que o alias se aplica.
      alias: Código tal como publicado, por exemplo PPD.
      group_code: Código correspondente, como listado em parliamentary_groups nessa legislatura.
      source_url: Referência para a correspondência.
      note: Porque existe o alias.

  seed_ept_holders:
    description: >-
      Correspondência entre titulares da EpT e o cadastro_id da AR (#47), uma linha por titular
      da Entidade para a Transparência que é Deputado ou Deputada na entidade 4508 (XVII) ou 510
      (antes da XVII). Escrito por python -m parlamento_aberto.ept_crosswalk a partir das listas de
      titularidades da EpT e da InformacaoBase XIV a XVII, comparando o nome completo normalizado
      dentro das legislaturas que o órgão cobre, e tirando todos os outros titulares de
      seed_ept_holder_overrides. Só ids. Dois ids de titular podem partilhar um cadastro_id quando
      a EpT registou a mesma pessoa com um novo id de titular no outro órgão.
    columns:
      ept_holder_id: Id do titular na EpT (holderId), único.
      cadastro_id: Id de cadastro do deputado na AR, nulo quando não há correspondência.
      match: name (nome completo normalizado, um candidato), override (de seed_ept_holder_overrides) ou unmatched (nenhum deputado da AR encontrado).

  seed_ept_holder_overrides:
    description: >-
      Titulares da EpT, mantidos à mão, para os quais a comparação de nomes não dá nenhum
      candidato ou dá mais do que um, cada um com uma nota sobre como foi resolvido (#47). Um
      cadastro_id vazio marca um titular sem deputado na AR.
    columns:
      ept_holder_id: Id do titular na EpT (holderId).
      cadastro_id: Id de cadastro na AR escolhido à mão, nulo quando não foi encontrado nenhum deputado da AR.
      note: Porquê este cadastro_id, ou porquê nenhum.

  initiatives:
    description: Uma linha por iniciativa.
    columns:
      legislature: Legislatura da iniciativa, a partir do caminho do ficheiro. A legislatura I é publicada em dois ficheiros, I-A e I-B.
      initiative_id: Id da iniciativa na AR.
      number: Número da iniciativa dentro do seu tipo e legislatura.
      type_code: Código do tipo de iniciativa, por exemplo J.
      type: Tipo de iniciativa, por exemplo Projeto de Lei.
      session_number: Sessão legislativa em que a iniciativa deu entrada.
      title: Título.
      author_kind: Tipo de autor tal como publicado, por exemplo Deputados, Grupos Parlamentares ou Governo.
      first_event_date: Data do primeiro evento da iniciativa.
      text_url: Ligação para o texto da iniciativa.

  initiative_authors:
    description: Uma linha por autor de uma iniciativa.
    columns:
      legislature: Legislatura da iniciativa.
      initiative_id: Iniciativa, liga a initiatives.
      author_type: deputy (deputado), group (grupo) ou other para qualquer autor que não seja deputado nem grupo (Governo, uma assembleia regional, uma comissão, cidadãos).
      cadastro_id: Num deputado, o id da pessoa, liga a deputies.
      group_code: Num deputado, o grupo indicado com ele; num grupo, o seu código. Depois de seed_group_aliases.
      group_code_raw: O mesmo código tal como publicado.
      name: Num deputado, o nome tal como publicado; em other, o autor (o nome da comissão, ou o tipo de autor, como Governo).

  votes:
    description: >-
      Uma linha por id de votação, a partir dos arrays Votacao dos eventos das Iniciativas (plenário), das
      suas entradas Comissao (comissão) e dos arrays VotacaoDebate das Atividades (plenário). Uma votação sobre várias iniciativas votadas em conjunto é
      publicada em cada uma delas com o mesmo conteúdo, pelo que é guardada uma só vez.
    quirks:
      - >-
        Uma votação sobre várias iniciativas é publicada em cada uma delas com o mesmo conteúdo, pelo que os ids de votação se repetem na fonte. O mapeador antigo guardava uma linha por cada evento em que a votação era publicada. Aqui há uma linha por id de votação, e initiative_votes liga-a a todas as iniciativas e eventos.
    columns:
      vote_id: Id da votação na AR.
      legislature: Legislatura em que cai a data da votação. Pode ser diferente da legislatura da iniciativa.
      date: Data da votação.
      body: Onde decorreu a votação, plenary (plenário) ou o nome da comissão. Filtre por plenary para ter só votações em plenário.
      committee_id: Numa votação em comissão, o id da comissão na AR; nulo nas votações em plenário.
      source: iniciativas ou atividades.
      result: Resultado tal como publicado, por exemplo Aprovado ou Rejeitado.
      unanimous: Verdadeiro quando a AR marca a votação como unânime.
      meeting: Número da reunião (do plenário ou da comissão).
      meeting_type: Código do tipo de reunião, RP para uma reunião plenária. Nulo nas votações em comissão.
      description: Descrição do que foi votado.
      detail: Quem votou em que sentido, tal como publicado. Nulo quando a AR não dá detalhe.
      absent_groups: Grupos indicados como ausentes, tal como publicado.
      source_records: Número de registos da fonte com este id de votação.

  initiative_votes:
    description: Liga as votações em plenário e em comissão às iniciativas e eventos em que são publicadas.
    columns:
      vote_id: Votação, liga a votes.
      initiative_id: Iniciativa, liga a initiatives.
      initiative_legislature: Legislatura da iniciativa.
      body: Onde decorreu a votação, plenary (plenário) ou o nome da comissão.
      event_id: Evento da iniciativa que contém a votação.
      phase: Fase desse evento, por exemplo Votação na generalidade.
      phase_date: Data desse evento.

  vote_group_positions:
    description: >-
      Uma linha por votação, grupo e sentido de voto, a partir do detalhe lido. As votações sem
      detalhe tiram os grupos e deputados ausentes do campo ausencias. Uma votação unânime que não indica
      nenhum sentido a favor, contra ou abstenção recebe uma linha a favor, com inferred = true, para
      cada outro grupo presente: numa votação em plenário, os grupos com um deputado com lugar na data
      da votação (a regra seated_on); numa votação em comissão, os grupos com um membro efetivo ativo
      da comissão na data da votação, segundo a ComposicaoOrgaos.
    columns:
      vote_id: Votação, liga a votes.
      legislature: Legislatura da votação.
      body: Onde decorreu a votação, plenary (plenário) ou o nome da comissão.
      group_code: Código do grupo depois de seed_group_aliases, liga a parliamentary_groups.group_acronym. Indep e Ninsc marcam deputados fora de qualquer grupo.
      group_code_raw: Código do grupo tal como publicado (ou, nas linhas inferidas, como na filiação do deputado na InformacaoBase).
      position: favour, against, abstention ou absent (a favor, contra, abstenção ou ausente).
      deputies: Nulo quando o grupo como um todo tomou esse sentido de voto (exceto deputados seus indicados noutro sentido). Caso contrário, o número dos seus deputados que o tomaram.
      inferred: Verdadeiro quando a linha vem da regra da unanimidade e não do detalhe publicado.

  vote_deputy_dissents:
    description: >-
      Uma linha por deputado nomeado no detalhe de uma votação, normalmente por votar de forma diferente do seu grupo,
      ou nomeado como ausente no campo ausencias de uma votação sem detalhe. Associado ao cadastro_id pelo nome parlamentar (ignorando maiúsculas e espaços) e pelo grupo
      dentro da legislatura da votação, ou só pelo nome para Indep e Ninsc.
    columns:
      vote_id: Votação, liga a votes.
      legislature: Legislatura da votação.
      body: Onde decorreu a votação, plenary (plenário) ou o nome da comissão.
      position: favour, against, abstention ou absent (a favor, contra, abstenção ou ausente).
      name: Nome tal como escrito no detalhe.
      group_code: Código do grupo depois de seed_group_aliases.
      group_code_raw: Código do grupo tal como escrito no detalhe.
      cadastro_id: Id da pessoa, liga a deputies. Nulo quando nenhum deputado corresponde ou corresponde mais do que um.
      candidates: Número de deputados que correspondem ao nome e ao grupo. 0 é sem correspondência, mais de 1 é ambíguo.

  # Interventions and questions (#7).
  stg_intervencoes__interventions:
    description: >-
      Intervencoes, uma linha por registo da fonte, incluindo os registos que a AR publica com
      todas as chaves a nulo. As contagens de linhas por legislatura batem com sources.lock.json.
    columns:
      intervention_id: Id da intervenção na AR (Id). Nulo nos registos vazios.
      session_number: Número da sessão legislativa (Sessao).
      meeting_date: Data da reunião plenária (DataReuniaoPlenaria).
      intervention_type: Tipo de intervenção tal como publicado (TipoIntervencao), por exemplo Intervenção ou Pedido de esclarecimento.
      session_phase: Parte da sessão tal como publicada (FaseSessao), POD (ordem do dia), PAOD (antes da ordem do dia) ou Outras.
      debate_id: Id do debate na AR (IdDebate).
      debate: Título do debate (Debate), muitas vezes nulo.
      debate_phase: Fase do debate tal como publicada (FaseDebate), por exemplo GENERALIDADE, muitas vezes nula.
      activity_id: Id na AR da atividade parlamentar a que a intervenção pertence (ActividadeId).
      summary: Sumário da intervenção (Sumario).
      abstract: Resumo mais longo (Resumo), muitas vezes nulo.
      cadastro_id: Id da pessoa do deputado que falou (Deputados.idCadastro), nulo quando quem falou não é deputado.
      speaker_name: Nome parlamentar do deputado (Deputados.nome).
      group_acronym: Grupo do deputado quando falou (Deputados.GP).
      speaker_role: Qualidade em que a pessoa falou, tal como publicada (Qualidade), por exemplo Deputado, P.A.R. ou Sec. Mesa.
      government_member_name: Nome do membro do Governo que falou (MembrosGoverno.nome).
      government_member_role: Cargo do membro do Governo (MembrosGoverno.cargo).
      government: Governo a que o membro pertencia (MembrosGoverno.governo).
      guest_name: Nome de um orador convidado (Convidados.nome).
      guest_role: Cargo do orador convidado (Convidados.cargo).
      publication_count: Número de referências de publicação (Publicacao); 1 em todos os registos até agora.
      publication_type: Série do Diário da publicação (Publicacao.pubTipo), por exemplo DAR I série.
      publication_number: Número do Diário (Publicacao.pubNr).
      publication_date: Data do Diário (Publicacao.pubdt).
      pages: Páginas do Diário tal como publicadas (Publicacao.pag), texto com zeros à esquerda.
      diary_url: Ligação para o número do Diário (Publicacao.URLDiario).
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_perguntas_requerimentos__questions:
    description: PerguntasRequerimentos, uma linha por registo da fonte. As contagens de linhas por legislatura batem com sources.lock.json.
    columns:
      question_id: Id da pergunta ou requerimento na AR (Id).
      question_type: Pergunta ou Requerimento (Tipo).
      recipient_category: Código da categoria do destinatário tal como publicado (ReqTipo). Pelos destinatários de cada código, AC é a administração central, AL a administração local, EI entidades independentes e outros organismos públicos, RA as regiões autónomas e AR a própria Assembleia.
      number: Número da pergunta ou requerimento dentro do seu tipo e sessão (Nr), tal como publicado.
      session_number: Número da sessão legislativa (Sessao).
      subject: Assunto (Assunto).
      entry_date: Data de registo (DtEntrada).
      sent_date_raw: Data de envio (DataEnvio), tal como publicada. Algumas são implausíveis, por exemplo o ano 0024 ou 2909; o mart questions assinala-as.
      document_url: Ligação para o documento da pergunta ou requerimento (Ficheiro).
      authors: Autores (Autores) como cadastro_id, name, group_acronym.
      recipients: Destinatários (Destinatarios) como recipient, sent_date, is_extended, is_returned, is_withdrawn, answer_dates.
      question_level_answers: Número de respostas publicadas na pergunta e não por destinatário (RespostasSPerguntas), usado em legislaturas mais antigas.
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  interventions:
    description: >-
      Uma linha por intervenção em plenário, com debate, orador e referência no Diário. O orador
      é um deputado (cadastro_id), um membro do Governo ou um convidado. Os registos que a AR publica
      com todas as chaves a nulo são excluídos.
    quirks:
      - >-
        A AR publica alguns registos de Intervencoes com todas as chaves a nulo. São excluídos aqui, pelo que as contagens de linhas ficam abaixo das contagens de registos em sources.lock.json, com as quais o modelo de staging bate.
    columns:
      legislature: Legislatura em numeração romana.
      intervention_id: Id da intervenção na AR.
      session_number: Número da sessão legislativa.
      meeting_date: Data da reunião plenária.
      intervention_type: Tipo de intervenção tal como publicado, por exemplo Intervenção ou Pedido de esclarecimento.
      session_phase: Parte da sessão tal como publicada, POD (ordem do dia), PAOD (antes da ordem do dia) ou Outras.
      debate_id: Id do debate na AR.
      debate: Título do debate, muitas vezes nulo.
      debate_phase: Fase do debate tal como publicada, por exemplo GENERALIDADE, muitas vezes nula.
      activity_id: Id na AR da atividade parlamentar a que a intervenção pertence.
      summary: Sumário da intervenção.
      abstract: Resumo mais longo, muitas vezes nulo.
      speaker_kind: deputy (deputado) quando cadastro_id está preenchido, senão government (Governo) quando é indicado um membro do Governo, senão guest (convidado) quando é indicado um convidado, senão nulo.
      cadastro_id: Id da pessoa do deputado que falou, liga a deputies. Nulo quando quem falou não é deputado.
      speaker_name: Nome parlamentar do deputado tal como publicado na intervenção.
      group_acronym: Grupo do deputado quando falou, liga a parliamentary_groups.
      speaker_role: Qualidade em que a pessoa falou, tal como publicada, por exemplo Deputado, P.A.R. ou Sec. Mesa.
      government_member_name: Nome do membro do Governo que falou.
      government_member_role: Cargo do membro do Governo.
      government: Governo a que o membro pertencia.
      guest_name: Nome de um orador convidado.
      guest_role: Cargo do orador convidado.
      publication_type: Série do Diário, por exemplo DAR I série.
      publication_number: Número do Diário.
      publication_date: Data do Diário.
      pages: Páginas do Diário tal como publicadas, texto com zeros à esquerda.
      diary_url: Ligação para o número do Diário.

  questions:
    description: Uma linha por pergunta ou requerimento que um deputado enviou ao Governo ou a outro organismo público.
    quirks:
      - >-
        Algumas datas de envio publicadas são impossíveis, por exemplo 2909-07-30 na X. O mapeador antigo guardava as datas ISO tal como publicadas. Aqui sent_date é nulo, sent_date_invalid é verdadeiro e sent_date_raw guarda o texto publicado.
    columns:
      legislature: Legislatura em numeração romana.
      question_id: Id da pergunta ou requerimento na AR.
      question_type: Pergunta ou Requerimento.
      recipient_category: Código da categoria do destinatário, AC (administração central), AL (administração local), EI (entidades independentes e outros organismos públicos), RA (regiões autónomas) ou AR (a Assembleia).
      number: Número dentro do seu tipo e sessão, tal como publicado.
      session_number: Número da sessão legislativa.
      subject: Assunto.
      entry_date: Data de registo.
      sent_date: Data de envio. Nulo quando sent_date_invalid é verdadeiro.
      sent_date_raw: Data de envio (DataEnvio) exatamente como publicada.
      sent_date_invalid: Verdadeiro quando a data publicada não se lê ou o seu ano fica fora dos anos da legislatura (uma legislatura em curso vai até hoje), por exemplo 2909 na X.
      document_url: Ligação para o documento da pergunta ou requerimento.
      author_count: Número de autores, uma linha cada em question_authors.
      recipient_count: Número de destinatários, uma linha cada em question_recipients.
      answer_count: Respostas recebidas, por destinatário, mais as publicadas na própria pergunta.

  question_authors:
    description: Uma linha por pergunta e autor.
    columns:
      legislature: Legislatura em numeração romana.
      question_id: Id da pergunta na AR, liga a questions.
      cadastro_id: Id da pessoa do autor, liga a deputies.
      author_name: Nome parlamentar do autor tal como publicado na pergunta.
      group_acronym: Grupo do autor na pergunta, liga a parliamentary_groups.

  question_recipients:
    description: Uma linha por pergunta e organismo destinatário.
    columns:
      legislature: Legislatura em numeração romana.
      question_id: Id da pergunta na AR, liga a questions.
      recipient: Nome do organismo destinatário tal como publicado, por exemplo um ministério ou uma câmara municipal.
      sent_date: Data de envio a este destinatário.
      is_extended: Verdadeiro quando o prazo de resposta foi prorrogado.
      is_returned: Verdadeiro quando o destinatário a devolveu.
      is_withdrawn: Verdadeiro quando foi retirada.
      answer_count: Respostas recebidas deste destinatário.
      first_answer_date: Data da primeira resposta, nula se não houver nenhuma.

  stg_registo_interesses__files:
    description: >-
      RegistoInteresses, uma linha por ficheiro. Todos os ficheiros listam as mesmas pessoas (as
      listas da XVII), e só a XI a XV têm declarações. Construído por um modelo em Python
      (interests.py), que falha perante um formato ou lista que não conhece.
    columns:
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado, relativo a data/.
      people: Registos no ficheiro, um por pessoa.
      declarations: Declarações encontradas no ficheiro.

  stg_registo_interesses__declarations:
    description: >-
      Declarações do RegistoInteresses, uma linha cada, a partir de cadRgi (V1, V2), RecordInterests
      (V3) ou do formulário V5. As datas estão tal como publicadas.
    columns:
      declaration_key: Chave construída como legislature-cadastro_id-n, em que n conta as declarações da pessoa no ficheiro.
      cadastro_id: Id da pessoa (cadId, RecordId ou IdCadastroGODE).
      format_version: Formato do registo, V1, V2, V3 ou V5.
      declaration_id: Id da declaração na AR (rgiId ou FactoDeclaracao.Id). A V3 não publica nenhum.
      declared_legislature: Legislatura indicada na declaração (rgiLegDes ou Legislatura). A V3 não indica nenhuma, por isso é a do ficheiro.
      position: Cargo declarado (rgiCargoDes, PositionDesignation ou CargoFuncao).
      position_start_raw: Início do cargo tal como publicado (rgiCargoData, um ano, PositionBeginDate ou DataInicioFuncao).
      position_changed_raw: Data de alteração do cargo tal como publicada (PositionChangedDate ou DataAlteracaoFuncao).
      position_end_raw: Fim do cargo tal como publicado (PositionEndDate ou DataCessacaoFuncao).
      version_date_raw: Data desta versão da declaração (rgiDataVersao), só V1 e V2.
      is_exclusive: Cargo exercido em exclusividade (V3 Exclusivity, V5 Exclusividade). Nulo para V1 e V2.
      items: Número de itens declarados, uma linha cada em stg_registo_interesses__items.
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_registo_interesses__items:
    description: >-
      Uma linha por item declarado, tal como publicado. Os campos de texto livre da V1 e da V2 (e as
      atividades da V1) dão um item cada.
    columns:
      declaration_key: Declaração a que o item pertence.
      item_number: Posição do item dentro da declaração.
      category: activity, social_position, society, support, service ou other_situation (atividade, cargo social, sociedade, apoio, serviço ou outra situação).
      source_list: Lista ou campo publicado de onde vem o item, por exemplo rgiCargosSociais ou GenCargosMenosTresAnos.
      item_id: Id do item na AR, quando publicado.
      type_code: Código Type da V3 tal como publicado (0, 1 ou 2), não documentado pela AR.
      description: Atividade, cargo, apoio, serviço ou situação tal como escrito.
      entity: Entidade, empresa ou organismo indicado.
      nature: Natureza da entidade ou do benefício (V5 Natureza, NaturezaBeneficio).
      activity_area: Área de atividade.
      location: Sede ou local.
      share: Participação social tal como escrita, para sociedades.
      paid_raw: Indicação de remuneração tal como publicada (S, N, ou 0 na V5).
      start_date_raw: Data de início tal como publicada, um ano, um mês ou um dia.
      end_date_raw: Data de fim tal como publicada.
      date_raw: Data única ou período tal como publicado nos apoios e serviços da V5.
      legislature: Legislatura em numeração romana, a partir do caminho do ficheiro.
      source_file: Ficheiro normalizado de onde a linha foi lida, relativo a data/.

  stg_ept_registo_interesses__declarations:
    description: >-
      Registo de interesses da EpT (XVI, XVII e as declarações anteriores da entidade 510), uma
      linha por declaração guardada de um Deputado ou Deputada, a partir de data/ept_registo_interesses.
      As primeiras colunas são as de stg_registo_interesses__declarations. As versões substituídas e
      modificadas ficam como linhas próprias. Não publicado até a EpT responder (#42).
    columns:
      declaration_key: Chave construída como ept:<id da declaração na EpT>.
      cadastro_id: Nulo aqui; os marts preenchem-no a partir de seed_ept_holders (#47).
      format_version: Sempre EPT.
      declaration_id: Id da declaração na EpT, o mesmo que source_declaration_id.
      declared_legislature: Nulo. As declarações da EpT indicam um órgão, não uma legislatura.
      position: Cargo como a EpT o designa, Deputado ou Deputada.
      position_start_raw: Início do cargo tal como publicado (startDate).
      position_changed_raw: Nulo. A EpT não publica data de alteração do cargo.
      position_end_raw: Fim do cargo tal como publicado (endDate).
      version_date_raw: Nulo. A EpT não tem data de versão; ver submitted_at.
      is_exclusive: Nulo. O separador 4 não tem campo de exclusividade.
      items: Número de linhas em stg_ept_registo_interesses__items para esta declaração.
      legislature: Legislatura cujas datas contêm o dia de início do cargo em Lisboa, ou o dia de entrega quando não há início. Não é tirada do órgão da EpT.
      source_file: Ficheiro guardado de onde a linha foi lida, relativo a data/.
      source: Sempre ept.
      source_format: Sempre EPT.
      source_declaration_id: Id da declaração na EpT.
      ept_holder_id: Id do titular na EpT, liga a seed_ept_holders.
      ept_entity_id: Órgão na EpT, 510 (Assembleia da República, XIV a XVI) ou 4508 (XVII Legislatura).
      ept_role_id: Cargo na EpT, 8 (Deputado) ou 232 (Deputada).
      position_start_date: Início do cargo como dia em Europe/Lisbon.
      position_changed_date: Nulo, como position_changed_raw.
      position_end_date: Fim do cargo como dia em Europe/Lisbon.
      version_date: Nulo, como version_date_raw.
      declaration_nature: initial, modification, cessation, final, replace ou reElection.
      declaration_state: published, replaced ou modified (e também draft, pendingVerification, notPublished ou canceled se a EpT listar alguma).
      supersedes_declaration_id: Declaração que esta substitui ou modifica (relatedDeclarationId).
      superseded_by_declaration_id: Declaração guardada que substitui ou modifica esta, se existir.
      chain_root_declaration_id: Primeira declaração guardada da cadeia de substituições ou modificações desta.
      submitted_at: Hora de entrega tal como publicada (submitedDate).
      submitted_date: Entrega como dia em Europe/Lisbon.
      is_current: Verdadeiro para a declaração publicada mais recente sem sucessora, por titular, órgão e cargo.

  stg_ept_registo_interesses__items:
    description: >-
      Uma linha por linha do separador 4 de uma declaração da EpT em stg_ept_registo_interesses__declarations.
      As primeiras colunas são as de stg_registo_interesses__items. O texto fica sem espaços nas pontas, e as
      datas ficam tal como publicadas nas colunas _raw e convertidas para o dia em Europe/Lisbon.
    columns:
      declaration_key: Declaração a que o item pertence.
      item_number: Posição do item dentro da declaração, com as secções pela ordem do separador 4.
      category: activity, association, support, service, society ou other_situation (atividade, associação, apoio, serviço, sociedade ou outra situação).
      source_list: Designação da secção do separador 4 como a EpT a mostra.
      item_id: Nulo. As linhas da EpT não têm id.
      type_code: Nulo. A EpT não tem código de tipo.
      description: Cargo, atividade, apoio, serviço ou situação tal como escrito.
      entity: Entidade, empresa ou organismo indicado.
      nature: Natureza de uma sociedade ou de um apoio ou benefício.
      activity_area: Natureza e área de atividade da entidade.
      location: Sede.
      share: Nulo. A EpT publica a participação como share_value_eur e share_pct.
      paid_raw: Remuneração tal como publicada, 1 ou 0, não documentada pela EpT.
      start_date_raw: Data de início tal como publicada, em UTC.
      end_date_raw: Data de fim tal como publicada, em UTC.
      date_raw: Data de uma outra situação tal como publicada.
      legislature: Legislatura da declaração.
      source_file: Ficheiro guardado de onde a linha foi lida, relativo a data/.
      source: Sempre ept.
      is_paid: Nulo. A EpT não diz o que significam 1 e 0.
      start_date: Data de início como dia em Europe/Lisbon.
      end_date: Data de fim como dia em Europe/Lisbon.
      entity_nipc: NIPC da entidade, só quando é um NIPC de empresa válido (9 dígitos, dígito de controlo mod 11, primeiro dígito 5, 6, 8 ou 9, ou prefixo 71, 72, 77 ou 79). Nulo nos outros casos.
      beneficiary: Beneficiário de um apoio ou benefício tal como escrito.
      beneficiary_company: Empresa do beneficiário, nos apoios.
      share_value_eur: Valor da participação social em euros, tal como escrito.
      share_pct: Percentagem da participação social, tal como escrita.
      share_holder: Titular da participação social tal como escrito.
      is_professional_secrecy: Segredo profissional invocado, nos serviços e outras situações.
      observation: Observação de uma outra situação.

  interest_declarations:
    description: >-
      Uma linha por declaração no registo de interesses, XI a XV. A XVI e a XVII não estão nos
      dados abertos da AR (as declarações passaram para a Entidade para a Transparência). Só estão
      cobertas as pessoas das listas da XVII, porque todos os ficheiros listam essas pessoas. Ficam
      de fora nomes, cônjuge, estado civil, regime de bens e campos fiscais e de contacto; para os
      nomes, faça join com deputies.
    columns:
      legislature: Legislatura em numeração romana, a partir do ficheiro.
      declaration_key: Chave da declaração, liga a interests.
      cadastro_id: Id da pessoa, liga a deputies.
      format_version: Formato publicado, V1 (XI), V2 (XII, XIII), V3 (XIV) ou V5 (XIV, XV).
      declaration_id: Id da declaração na AR. Nulo para a V3, que não publica nenhum.
      position: Cargo declarado, por exemplo Deputado.
      position_start_date: Início do cargo, quando publicado como data completa.
      position_changed_date: Data de alteração do cargo, quando publicada como data completa.
      position_end_date: Fim do cargo, quando publicado como data completa.
      position_start_raw: Início do cargo tal como publicado. A V1 e a V2 publicam um ano.
      version_date: Data desta versão da declaração, só V1 e V2.
      is_exclusive: Cargo exercido em exclusividade. Nulo para V1 e V2.
      items: Número de linhas em interests para esta declaração.

  interests:
    description: >-
      Uma linha por interesse declarado: atividades e cargos, cargos sociais, sociedades, apoios,
      serviços e outras situações. O texto está tal como publicado, por isso os itens de texto livre
      podem dizer "Nada a declarar". O JSON prevalece sobre o mapeador antigo: a V1 publica as
      atividades como um único campo de texto livre, e a V5 também é lida (XIV, XV), porque o dump a
      contém.
    columns:
      legislature: Legislatura em numeração romana.
      declaration_key: Declaração, liga a interest_declarations.
      item_number: Posição do item dentro da declaração.
      cadastro_id: Id da pessoa, liga a deputies.
      category: activity, social_position, society, support, service ou other_situation (atividade, cargo social, sociedade, apoio, serviço ou outra situação).
      source_list: Lista ou campo publicado de onde vem o item, por exemplo GenCargosMaisTresAnos.
      item_id: Id do item na AR, quando publicado.
      type_code: Código Type da V3 tal como publicado (0, 1 ou 2), não documentado pela AR.
      description: Atividade, cargo, apoio, serviço ou situação tal como escrito.
      entity: Entidade, empresa ou organismo indicado.
      nature: Natureza da entidade ou do benefício, só V5.
      activity_area: Área de atividade.
      location: Sede ou local.
      share: Participação social tal como escrita, para sociedades.
      is_paid: Verdadeiro para S, falso para N. Nulo nos outros casos, incluindo o 0 que a V5 publica.
      start_date: Data de início, quando publicada como data completa.
      end_date: Data de fim, quando publicada como data completa.
      start_date_raw: Data de início tal como publicada, um ano, um mês ou um dia.
      end_date_raw: Data de fim tal como publicada.
      date_raw: Data única ou período tal como publicado nos apoios e serviços da V5.
