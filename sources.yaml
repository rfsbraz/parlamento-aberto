# Every AR open data JSON file, per dataset and legislature.
# The newest legislature listed here is the current one for the nightly run.
# layout: records = one JSON file per record, by id; tables = NDJSON per table.
# ids: per-table natural key used for record order; bucket: split into fixed id ranges.
# names: file name for a table. Natural keys and sizes: see PR #2 notes.
# Per file: listed_on = the legislature page the file is listed on, when not its own;
# path = dotted path to the record list in the older XML-shaped files; id = per-file id;
# format = xml for a file read as XML (default json);
# copy_of = the file is an older snapshot of that legislature's register (same ids,
# older content): fetched and hashed, not stored,
# and a record outside it holds the data PR (hold: source-changed).
# merge: upsert = AR's file updates and adds records by id and never deletes the ones it
# leaves out; rows with a null id are dropped. Only `fetch --prune` deletes (#133).
# rolling: true = the file is a moving window (the agenda lists the coming weeks), so a
# drop of more than 5% is written and flagged. An upsert source flags a drop in its merged
# count. Anywhere else a drop keeps the last good copy and marks the file stale (#135).
