name: fiscaliza dispatch

# Avisa o Fiscaliza (rfsbraz/parliament) de que main mudou, com um repository_dispatch
# data-updated que leva o commit. É o Fiscaliza que valida o commit, abre o PR que move o
# seu pin e o integra quando o CI passa (docs/repo-settings.md, "Aviso ao Fiscaliza").
#
# Corre só em push para main, nunca em pull_request nem pull_request_target, para que um PR
# vindo de um fork não chegue ao secret. Quando eu ligar DATA_RELEASES, o aviso passa a sair
# em release: published (#93).
#
# Só quando muda o que o Fiscaliza lê no commit do pin: corre `uv run --locked python -m
# parlamento_aberto.release build --data data` (deploy/pages.py no parliament), por isso os
# dados, o pacote com os modelos, seeds e schema.yml, e o ambiente do uv. Docs, CI, testes e
# templates não o movem. Este ficheiro também não: mudá-lo não muda os dados.
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/parlamento_aberto/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'

# Não precisa do GITHUB_TOKEN para nada.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar o Fiscaliza
        env:
          FISCALIZA_DISPATCH_TOKEN: ${{ secrets.FISCALIZA_DISPATCH_TOKEN }}
        run: |
          if [ -z "$FISCALIZA_DISPATCH_TOKEN" ]; then
            echo "::notice::Sem o secret FISCALIZA_DISPATCH_TOKEN, o Fiscaliza não foi avisado."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $FISCALIZA_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rfsbraz/parliament/dispatches \
            -d '{"event_type":"data-updated","client_payload":{"sha":"'"$GITHUB_SHA"'"}}'
          echo "Fiscaliza avisado: $GITHUB_SHA"
