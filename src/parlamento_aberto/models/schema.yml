# Version of the published schema, in manifest.json. Bump the major on a breaking change
# (a column removed or renamed, a type changed); the site refuses an unknown major.
schema_version: "1.0.0"

# Every model, in run order, with a description of every column.
# The data dictionary in docs/dictionary is generated from this file
# (uv run python -m parlamento_aberto.dictionary). An optional quirks list on a model
# goes on its page, for example where the JSON disagrees with the old mappers.
models:
  seed_seats:
    description: >-
      Seats in the Assembleia da República per legislature, hand-kept, each row citing its
      source. Constituinte is the 1975-1976 Constituent Assembly, with 250 seats. Legislature I is split like the AR folders: I-A (from 1976, 263 seats) and
      I-B (from the December 1979 interim election, 250 seats), with the same citation.
    columns:
      legislature: Legislature in Roman numerals as in the AR folder names, for example XVII or I-A.
      seats: Total number of seats in that legislature.
      source: Where the seat count comes from.

  stg_informacao_base__legislatures:
    description: InformacaoBase DetalheLegislatura, one row per legislature file.
    columns:
      legislature_id: AR internal id of the legislature (id).
      start_date: First day of the legislature (dtini).
      end_date: Last day of the legislature (dtfim), null while it is running.
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_informacao_base__sessions:
    description: InformacaoBase SessoesLegislativas, one row per legislative session.
    columns:
      session_number: Session number within the legislature (numSessao).
      start_date: First day of the session (dataInicio).
      end_date: Last day of the session (dataFim).
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_informacao_base__electoral_circles:
    description: InformacaoBase CirculosEleitorais, one row per electoral circle.
    columns:
      circle_id: AR id of the electoral circle (cpId).
      name: Name of the electoral circle (cpDes).
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_informacao_base__parliamentary_groups:
    description: InformacaoBase GruposParlamentares, one row per parliamentary group.
    columns:
      group_acronym: Group acronym (sigla), for example PS.
      name: Full name of the party or group (nome).
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_informacao_base__deputies:
    description: InformacaoBase Deputados, one row per person on the lists of a legislature, elected or not.
    columns:
      cadastro_id: Person id shared across legislatures and datasets (DepCadId).
      deputy_id: Id of this person in this legislature (DepId).
      full_name: Full name (DepNomeCompleto).
      parliamentary_name: Name used in parliament (DepNomeParlamentar).
      circle_id: Electoral circle the person ran in (DepCPId).
      circle_name: Name of that electoral circle (DepCPDes).
      situations: Situation periods (DepSituacao) as situation, start_date, end_date.
      groups: Group memberships (DepGP) as group_id, group_acronym, start_date, end_date.
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_registo_biografico__biographies:
    description: >-
      RegistoBiografico, one row per person record, scalar fields only. II and III come from
      the older XML-shaped files listed on the AR I Legislatura page (camelCase keys), and
      Constituinte from the older RegistoBiograficoConstituinte.xml in the same shape. The
      other pages are older snapshots of the XVII register and are not stored, except I (335
      people), so I rows are not that legislature's deputies (docs/known-gaps.md).
    columns:
      cadastro_id: Person id shared across legislatures and datasets (CadId).
      full_name: Full name (CadNomeCompleto).
      birth_date: Date of birth (CadDtNascimento).
      sex: Sex as published by the AR, M or F (CadSexo).
      profession: Profession (CadProfissao).
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  legislatures:
    description: One row per legislature.
    columns:
      legislature: Legislature in Roman numerals, for example XVII.
      legislature_id: AR internal id of the legislature.
      start_date: First day of the legislature.
      end_date: Last day of the legislature, null while it is running.
      extract_date: Date of the AR extract, taken from the end date AR writes on open group memberships.

  sessions:
    description: One row per legislative session.
    columns:
      legislature: Legislature in Roman numerals.
      session_number: Session number within the legislature.
      start_date: First day of the session.
      end_date: Last day of the session.

  electoral_circles:
    description: One row per electoral circle per legislature.
    columns:
      legislature: Legislature in Roman numerals.
      circle_id: AR id of the electoral circle.
      name: Name of the electoral circle.

  parliamentary_groups:
    description: One row per parliamentary group per legislature.
    columns:
      legislature: Legislature in Roman numerals.
      group_acronym: Group acronym, for example PS.
      name: Full name of the party or group.

  seed_coalitions:
    description: >-
      Hand-kept list of the electoral coalitions that won seats, one row per legislature,
      coalition list and parliamentary group it maps to, each row citing its source. Started
      from the old coalition_detector.py, keeping only coalitions that elected deputies and
      groups that exist in parliamentary_groups.
    columns:
      legislature: Legislature in Roman numerals (the data folder name) the election filled.
      coalition: Short name the coalition is known by, for example AD or CDU.
      ballot_acronym: Acronym of the list on the ballot, for example PCP-PEV or PPD/PSD.CDS-PP.
      coalition_name: Name of the coalition list.
      group_code: Parliamentary group its deputies sat in, as listed in that legislature's parliamentary_groups.
      source_url: Reference for the composition of the coalition.
      election_url: CNE page of the election, with the official results map.
      note: Exceptions, for example circles where the parties ran separately.

  coalitions:
    description: >-
      One row per legislature, coalition list and parliamentary group, from seed_coalitions.
      Use it to read results by group: for example AD in XVII sits as PSD and CDS-PP, and CDU
      as PCP (and PEV until XIV). Parties that ran alone are not listed.
    columns:
      legislature: Legislature in Roman numerals.
      coalition: Short name the coalition is known by, for example AD or CDU.
      ballot_acronym: Acronym of the list on the ballot.
      coalition_name: Name of the coalition list.
      group_code: Parliamentary group, joins to parliamentary_groups on legislature and group_acronym.
      group_name: Name of that group in parliamentary_groups.
      source_url: Reference for the composition of the coalition.
      election_url: CNE page of the election, with the official results map.
      note: Exceptions, for example circles where the parties ran separately.

  deputies:
    description: One row per person (cadastro_id) who appears on any list, elected or not. Use mandates to find who sat when.
    columns:
      cadastro_id: Person id shared across legislatures and datasets.
      full_name: Full name, from RegistoBiografico when present, otherwise from the latest InformacaoBase.
      parliamentary_name: Name used in parliament, from the latest legislature the person appears in.
      sex: Sex as published by the AR, M or F. Null without a RegistoBiografico record.
      birth_date: Date of birth. Null without a RegistoBiografico record.
      profession: Profession. Null without a RegistoBiografico record.
      biography_legislature: >-
        Legislature of the RegistoBiografico record the biography fields come from, the latest
        one for the person. Real per-legislature biographies exist only for Constituinte, II and
        III; XVII is the current register. Null without a RegistoBiografico record.

  mandates:
    description: >-
      One row per deputy, legislature and situation period (DepSituacao), as published.
      Who held a seat on day D is the seated_on(D) query, not a column; seated_during(D0, D1)
      gives the same for every day in a range, and the vote marts use it. AR periods for one
      person can overlap on a handover day, for example an Efetivo and a Suspenso period that
      both cover the same day. The rule: among a person's periods covering D, the one that
      starts latest wins, on a tie the longer one (an open end counts as longest) wins, and on
      a tie in both dates the effective one wins. The person is seated if that period is
      Efetivo, Efetivo Temporário or Efetivo Definitivo. On a swap day, when a circle has more
      deputies on D than on both D - 1 and D + 1, effective periods that end on D (with no
      effective period for the same person starting on D + 1) do not count, up to that excess
      and the number of people starting a seat on D. Counts for Constituinte to VI are still
      overstated on many days, see docs/known-gaps.md.
    quirks:
      - >-
        InformacaoBase lists everyone on the lists of a legislature, elected or not: 1,446 people for XVII at the 20 Oct 2026 sync, against 230 seats. Count seats from the is_effective periods that cover a date, not from rows of the lists. The old site counted every record as a deputy.
    columns:
      legislature: Legislature in Roman numerals.
      cadastro_id: Person id, joins to deputies.
      deputy_id: Id of this person in this legislature.
      circle_id: Electoral circle the person ran in, joins to electoral_circles.
      situation: Situation as published, for example Efetivo, Suplente, Suspenso(Eleito).
      is_effective: True for Efetivo, Efetivo Temporário and Efetivo Definitivo, the situations that hold a seat.
      start_date: First day of the situation.
      end_date: Last day of the situation, null while it is open.

  group_memberships:
    description: One row per deputy, legislature and parliamentary group period (DepGP).
    quirks:
      - >-
        AR writes the extract date as the end date of an open membership. The old mapper stored that date as published, so open memberships looked closed. Here an open membership has a null end_date and is_open = true.
    columns:
      legislature: Legislature in Roman numerals.
      cadastro_id: Person id, joins to deputies.
      group_id: AR id of the group in this legislature (gpId).
      group_acronym: Group acronym, joins to parliamentary_groups.
      start_date: First day in the group.
      end_date: Last day in the group, null while the membership is open.
      is_open: True when the legislature is running and AR's end date is on or after the extract date.

  stg_iniciativas__initiatives:
    description: Iniciativas, one row per initiative record.
    columns:
      initiative_id: AR id of the initiative (IniId).
      number: Initiative number within its type and legislature (IniNr).
      type_code: Initiative type code (IniTipo), for example J.
      type: Initiative type (IniDescTipo), for example Projeto de Lei.
      session_number: Legislative session the initiative was submitted in (IniSel).
      title: Title (IniTitulo).
      text_url: Link to the initiative text (IniLinkTexto).
      author_kind_code: Code of the kind of author (IniAutorOutros.sigla), for example D, G or V.
      author_kind: Kind of author (IniAutorOutros.nome), for example Deputados, Grupos Parlamentares or Governo.
      author_committee: Committee that authored the initiative, when the author is a committee (IniAutorOutros.iniAutorComissao).
      author_deputies: Deputy authors (IniAutorDeputados) as cadastro_id, name, group_acronym.
      author_groups: Group authors (IniAutorGruposParlamentares) as group acronyms.
      events: Events (IniEventos) as event_id, phase, phase_date, the raw plenary votes (Votacao) and the committees (Comissao) as committee_id, committee_name and their raw votes.
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_iniciativas__votes:
    description: One row per vote record (Votacao) in an initiative event. A vote on several initiatives appears once per initiative.
    columns:
      vote_id: AR id of the vote (id).
      initiative_id: Initiative the record is published on.
      event_id: Event the vote belongs to (EvtId).
      phase: Phase of that event (Fase), for example Votação na generalidade.
      phase_date: Date of that event (DataFase).
      date: Date of the vote (data).
      result: Result as published (resultado), for example Aprovado or Rejeitado.
      meeting: Meeting number (reuniao).
      meeting_type: Meeting type code (tipoReuniao), RP for a plenary meeting.
      unanimous: True when the AR marks the vote unanimous (unanime), otherwise false.
      description: Description of what was voted (descricao).
      detail: Who voted which way (detalhe), null when absent or empty.
      absent_groups: Groups listed as absent (ausencias).
      legislature: Legislature of the initiative, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_atividades__votes:
    description: One row per vote record (VotacaoDebate) on an activity in Atividades AtividadesGerais, such as a vote of condolence or a motion.
    columns:
      vote_id: AR id of the vote (id).
      activity_type: Activity type code (Tipo), for example VOT or MOC.
      activity_type_description: Activity type (DescTipo).
      activity_number: Activity number (Numero).
      activity_subject: Activity subject (Assunto).
      date: Date of the vote (data).
      result: Result as published (resultado).
      meeting: Meeting number (reuniao).
      meeting_type: Meeting type code (tipoReuniao).
      unanimous: True when the AR marks the vote unanimous (unanime), otherwise false.
      description: Description of what was voted (descricao).
      detail: Who voted which way (detalhe), null when absent or empty.
      absent_groups: Groups listed as absent (ausencias).
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_iniciativas__committee_votes:
    description: One row per committee vote record (Votacao inside IniEventos[].Comissao[]).
    columns:
      vote_id: AR id of the vote (id). Committee vote ids do not overlap plenary ones.
      initiative_id: Initiative the record is published on.
      event_id: Event the committee entry belongs to (EvtId).
      phase: Phase of that event (Fase).
      phase_date: Date of that event (DataFase).
      committee_id: AR id of the committee (IdComissao), the same id as idOrgao in ComposicaoOrgaos.
      committee_name: Committee name (Nome), trimmed.
      date: Date of the vote (data).
      result: Result as published (resultado).
      meeting: Committee meeting number (reuniao).
      unanimous: True when the AR marks the vote unanimous (unanime), otherwise false.
      description: Description of what was voted (descricao), for example MAIORIA or ARTIGO A ARTIGO.
      detail: Who voted which way (detalhe), null when absent or empty.
      absent_groups: Groups listed as absent (ausencias).
      legislature: Legislature of the initiative, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_composicao_orgaos__committee_members:
    description: ComposicaoOrgaos Comissoes, one row per committee member record (HistoricoComposicao).
    columns:
      committee_id: AR id of the committee (DetalheOrgao.idOrgao).
      committee_name: Committee name (DetalheOrgao.nomeSigla), trimmed.
      cadastro_id: Person id (depCadId), joins to deputies.
      situations: Membership periods (depSituacao) as status (sioDes, Ativo or Inativo), membership (sioTipMem, Efetivo or Suplente), start_date, end_date.
      groups: Group periods (depGP) as group_acronym, start_date, end_date. An open period has a null end date.
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_votes__detail_items:
    description: >-
      Built in Python by the vote parser. One row per item in each distinct vote detail
      string, or one row with an error when the parser rejects the string.
    columns:
      detail: The detail string, joins to the detail column of the vote models.
      item_number: Position of the item in the string, from 1. 0 on an error row.
      kind: group (a whole group), count (a number of a group's deputies, as in 2-PS) or deputy (a named deputy).
      group_acronym: Group code as written in the string.
      position: favour, against, abstention or absent.
      deputies: For a count item, the number of deputies.
      name: For a deputy item, the name as written in the string.
      error: Why the parser rejected the string, null when it was parsed.

  seed_group_aliases:
    description: >-
      Hand-kept aliases for group codes the AR writes differently within a legislature, each
      row citing its source. Marts keep the published code in group_code_raw and put the
      aliased code, or the published one when no alias applies, in group_code.
    columns:
      legislature: Legislature in Roman numerals (the data folder name, for example I-B) the alias applies to.
      alias: Code as published, for example PPD.
      group_code: Code it maps to, as listed in that legislature's parliamentary_groups.
      source_url: Reference for the mapping.
      note: Why the alias exists.

  seed_ept_holders:
    description: >-
      EpT holder to AR cadastro_id crosswalk (#47), one row per Entidade para a Transparência
      holder who is a Deputado or Deputada at entity 4508 (XVII) or 510 (before XVII). Written by
      python -m parlamento_aberto.ept_crosswalk from the EpT titularidade lists and InformacaoBase
      XIV to XVII, matching the normalised full name within the legislatures the body covers, and
      taking every other holder from seed_ept_holder_overrides. Ids only. Two holder ids can share a
      cadastro_id when EpT filed one person under a new holder id at the other body.
    columns:
      ept_holder_id: EpT holder id (holderId), unique.
      cadastro_id: AR cadastro id of the deputy, null when unmatched.
      match: name (normalised full name, one candidate), override (from seed_ept_holder_overrides) or unmatched (no AR deputy found).

  seed_ept_holder_overrides:
    description: >-
      Hand-kept EpT holders the name match leaves with no candidate or more than one, each with a
      note on how it was resolved (#47). An empty cadastro_id marks a holder with no AR deputy.
    columns:
      ept_holder_id: EpT holder id (holderId).
      cadastro_id: AR cadastro id picked by hand, null when no AR deputy was found.
      note: Why this cadastro_id, or why none.

  initiatives:
    description: One row per initiative.
    columns:
      legislature: Legislature of the initiative, from the file path. Legislature I is published in two files, I-A and I-B.
      initiative_id: AR id of the initiative.
      number: Initiative number within its type and legislature.
      type_code: Initiative type code, for example J.
      type: Initiative type, for example Projeto de Lei.
      session_number: Legislative session the initiative was submitted in.
      title: Title.
      author_kind: Kind of author as published, for example Deputados, Grupos Parlamentares or Governo.
      first_event_date: Date of the earliest event on the initiative.
      text_url: Link to the initiative text.

  initiative_authors:
    description: One row per author of an initiative.
    columns:
      legislature: Legislature of the initiative.
      initiative_id: Initiative, joins to initiatives.
      author_type: deputy, group, or other for any author that is not a deputy or a group (Governo, a regional assembly, a committee, citizens).
      cadastro_id: For a deputy, the person id, joins to deputies.
      group_code: For a deputy, the group listed with them; for a group, its code. After seed_group_aliases.
      group_code_raw: The same code as published.
      name: For a deputy, the name as published; for other, the author (the committee name, or the kind of author such as Governo).

  votes:
    description: >-
      One row per vote id, from the Votacao arrays of Iniciativas events (plenary), of
      their Comissao entries (committee) and the VotacaoDebate arrays of Atividades (plenary). A vote on several initiatives voted together is
      published on each of them with the same content, so it is kept once.
    quirks:
      - >-
        A vote on several initiatives is published on each of them with the same content, so vote ids repeat in the source. The old mapper stored one row per event the vote was published on. Here it is one row per vote id, and initiative_votes links it to every initiative and event.
    columns:
      vote_id: AR id of the vote.
      legislature: Legislature the vote date falls in. Can differ from the initiative's legislature.
      date: Date of the vote.
      body: Where the vote was held, plenary or the committee name. Filter on plenary for plenary votes only.
      committee_id: For a committee vote, the AR id of the committee; null for plenary votes.
      source: iniciativas or atividades.
      result: Result as published, for example Aprovado or Rejeitado.
      unanimous: True when the AR marks the vote unanimous.
      meeting: Meeting number (of the plenary or of the committee).
      meeting_type: Meeting type code, RP for a plenary meeting. Null for committee votes.
      description: Description of what was voted.
      detail: Who voted which way, as published. Null when the AR gives no detail.
      absent_groups: Groups listed as absent, as published.
      source_records: Number of source records with this vote id.

  initiative_votes:
    description: Links plenary and committee votes to the initiatives and events they are published on.
    columns:
      vote_id: Vote, joins to votes.
      initiative_id: Initiative, joins to initiatives.
      initiative_legislature: Legislature of the initiative.
      body: Where the vote was held, plenary or the committee name.
      event_id: Event on the initiative that carries the vote.
      phase: Phase of that event, for example Votação na generalidade.
      phase_date: Date of that event.

  vote_group_positions:
    description: >-
      One row per vote, group and position, from the parsed detail. Votes without a detail
      take absent groups and deputies from the ausencias field. A unanimous vote that lists no favour,
      against or abstention position gets a favour row, with inferred = true, for every
      other group present: for a plenary vote, groups with a deputy seated on the vote date
      (the seated_on rule); for a committee vote, groups with an active effective member of
      the committee on the vote date, from ComposicaoOrgaos.
    columns:
      vote_id: Vote, joins to votes.
      legislature: Legislature of the vote.
      body: Where the vote was held, plenary or the committee name.
      group_code: Group code after seed_group_aliases, joins to parliamentary_groups.group_acronym. Indep and Ninsc mark deputies outside any group.
      group_code_raw: Group code as published (or, for inferred rows, as in the deputy's InformacaoBase membership).
      position: favour, against, abstention or absent.
      deputies: Null when the group as a whole took the position (apart from any of its deputies listed under another position). Otherwise the number of its deputies who did.
      inferred: True when the row comes from the unanimous rule rather than the published detail.

  vote_deputy_dissents:
    description: >-
      One row per deputy named in a vote detail, usually for voting apart from their group,
      or named as absent in the ausencias field of a vote without a detail. Matched to cadastro_id by parliamentary name (ignoring case and spacing) and group
      within the vote's legislature, or by name alone for Indep and Ninsc.
    columns:
      vote_id: Vote, joins to votes.
      legislature: Legislature of the vote.
      body: Where the vote was held, plenary or the committee name.
      position: favour, against, abstention or absent.
      name: Name as written in the detail.
      group_code: Group code after seed_group_aliases.
      group_code_raw: Group code as written in the detail.
      cadastro_id: Person id, joins to deputies. Null when no deputy or more than one matches.
      candidates: Number of deputies matching the name and group. 0 is unmatched, more than 1 is ambiguous.

  # Interventions and questions (#7).
  stg_intervencoes__interventions:
    description: >-
      Intervencoes, one row per source record, including the records AR publishes with every
      key null. Row counts per legislature match sources.lock.json.
    columns:
      intervention_id: AR id of the intervention (Id). Null on the empty records.
      session_number: Legislative session number (Sessao).
      meeting_date: Date of the plenary meeting (DataReuniaoPlenaria).
      intervention_type: Type of intervention as published (TipoIntervencao), for example Intervenção or Pedido de esclarecimento.
      session_phase: Part of the sitting as published (FaseSessao), POD (ordem do dia), PAOD (antes da ordem do dia) or Outras.
      debate_id: AR id of the debate (IdDebate).
      debate: Debate title (Debate), often null.
      debate_phase: Phase of the debate as published (FaseDebate), for example GENERALIDADE, often null.
      activity_id: AR id of the parliamentary activity the intervention belongs to (ActividadeId).
      summary: Summary of the intervention (Sumario).
      abstract: Longer abstract (Resumo), often null.
      cadastro_id: Person id of the deputy who spoke (Deputados.idCadastro), null when the speaker is not a deputy.
      speaker_name: Parliamentary name of the deputy (Deputados.nome).
      group_acronym: Group of the deputy when speaking (Deputados.GP).
      speaker_role: Capacity the person spoke in as published (Qualidade), for example Deputado, P.A.R. or Sec. Mesa.
      government_member_name: Name of the government member who spoke (MembrosGoverno.nome).
      government_member_role: Office of the government member (MembrosGoverno.cargo).
      government: Government the member belonged to (MembrosGoverno.governo).
      guest_name: Name of an invited speaker (Convidados.nome).
      guest_role: Office of the invited speaker (Convidados.cargo).
      publication_count: Number of publication references (Publicacao); 1 on every record so far.
      publication_type: Diary series of the publication (Publicacao.pubTipo), for example DAR I série.
      publication_number: Diary issue number (Publicacao.pubNr).
      publication_date: Diary issue date (Publicacao.pubdt).
      pages: Diary pages as published (Publicacao.pag), zero-padded strings.
      diary_url: Link to the diary issue (Publicacao.URLDiario).
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_perguntas_requerimentos__questions:
    description: PerguntasRequerimentos, one row per source record. Row counts per legislature match sources.lock.json.
    columns:
      question_id: AR id of the question or request (Id).
      question_type: Pergunta or Requerimento (Tipo).
      recipient_category: Recipient category code as published (ReqTipo). From the recipients under each code, AC is central government, AL local government, EI independent and other public bodies, RA the autonomous regions and AR the Assembleia itself.
      number: Number of the question or request within its type and session (Nr), as published.
      session_number: Legislative session number (Sessao).
      subject: Subject (Assunto).
      entry_date: Date it was registered (DtEntrada).
      sent_date_raw: Date it was sent (DataEnvio), as published. A few are implausible, for example year 0024 or 2909; the questions mart flags them.
      document_url: Link to the question or request document (Ficheiro).
      authors: Authors (Autores) as cadastro_id, name, group_acronym.
      recipients: Recipients (Destinatarios) as recipient, sent_date, is_extended, is_returned, is_withdrawn, answer_dates.
      question_level_answers: Number of answers published on the question rather than per recipient (RespostasSPerguntas), used in older legislatures.
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  interventions:
    description: >-
      One row per intervention in plenary, with debate, speaker and diary reference. The speaker
      is a deputy (cadastro_id), a government member or an invited guest. Records AR publishes
      with every key null are dropped.
    quirks:
      - >-
        AR publishes some Intervencoes records with every key null. They are dropped here, so row counts are below the record counts in sources.lock.json, which the staging model matches.
    columns:
      legislature: Legislature in Roman numerals.
      intervention_id: AR id of the intervention.
      session_number: Legislative session number.
      meeting_date: Date of the plenary meeting.
      intervention_type: Type of intervention as published, for example Intervenção or Pedido de esclarecimento.
      session_phase: Part of the sitting as published, POD (ordem do dia), PAOD (antes da ordem do dia) or Outras.
      debate_id: AR id of the debate.
      debate: Debate title, often null.
      debate_phase: Phase of the debate as published, for example GENERALIDADE, often null.
      activity_id: AR id of the parliamentary activity the intervention belongs to.
      summary: Summary of the intervention.
      abstract: Longer abstract, often null.
      speaker_kind: deputy when cadastro_id is set, otherwise government when a government member is named, otherwise guest when a guest is named, otherwise null.
      cadastro_id: Person id of the deputy who spoke, joins to deputies. Null when the speaker is not a deputy.
      speaker_name: Parliamentary name of the deputy as published on the intervention.
      group_acronym: Group of the deputy when speaking, joins to parliamentary_groups.
      speaker_role: Capacity the person spoke in as published, for example Deputado, P.A.R. or Sec. Mesa.
      government_member_name: Name of the government member who spoke.
      government_member_role: Office of the government member.
      government: Government the member belonged to.
      guest_name: Name of an invited speaker.
      guest_role: Office of the invited speaker.
      publication_type: Diary series, for example DAR I série.
      publication_number: Diary issue number.
      publication_date: Diary issue date.
      pages: Diary pages as published, zero-padded strings.
      diary_url: Link to the diary issue.

  questions:
    description: One row per pergunta or requerimento a deputy sent to government or another public body.
    quirks:
      - >-
        Some published send dates are impossible, for example 2909-07-30 in X. The old mapper kept ISO dates as published. Here sent_date is null and sent_date_invalid is true, and sent_date_raw keeps the published text.
    columns:
      legislature: Legislature in Roman numerals.
      question_id: AR id of the question or request.
      question_type: Pergunta or Requerimento.
      recipient_category: Recipient category code, AC (central government), AL (local government), EI (independent and other public bodies), RA (autonomous regions) or AR (the Assembleia).
      number: Number within its type and session, as published.
      session_number: Legislative session number.
      subject: Subject.
      entry_date: Date it was registered.
      sent_date: Date it was sent. Null when sent_date_invalid is true.
      sent_date_raw: Date it was sent (DataEnvio) exactly as published.
      sent_date_invalid: True when the published date does not parse or its year is outside the years of the legislature (an open legislature runs to today), for example 2909 in X.
      document_url: Link to the question or request document.
      author_count: Number of authors, one row each in question_authors.
      recipient_count: Number of recipients, one row each in question_recipients.
      answer_count: Answers received, per recipient plus those published on the question itself.

  question_authors:
    description: One row per question and author.
    columns:
      legislature: Legislature in Roman numerals.
      question_id: AR id of the question, joins to questions.
      cadastro_id: Person id of the author, joins to deputies.
      author_name: Parliamentary name of the author as published on the question.
      group_acronym: Group of the author on the question, joins to parliamentary_groups.

  question_recipients:
    description: One row per question and recipient body.
    columns:
      legislature: Legislature in Roman numerals.
      question_id: AR id of the question, joins to questions.
      recipient: Name of the recipient body as published, for example a ministry or a câmara municipal.
      sent_date: Date it was sent to this recipient.
      is_extended: True when the answer deadline was extended (prorrogado).
      is_returned: True when the recipient returned it (devolvido).
      is_withdrawn: True when it was withdrawn (retirado).
      answer_count: Answers received from this recipient.
      first_answer_date: Date of the first answer, null without one.

  stg_registo_interesses__files:
    description: >-
      RegistoInteresses, one row per file. Every file lists the same people (the XVII
      lists), and only XI to XV hold declarations. Built by a Python model
      (interests.py), which fails on a format or list it does not know.
    columns:
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file, relative to data/.
      people: Records in the file, one per person.
      declarations: Declarations found in it.

  stg_registo_interesses__declarations:
    description: >-
      RegistoInteresses declarations, one row each, from cadRgi (V1, V2), RecordInterests
      (V3) or the V5 form. Dates are as published.
    columns:
      declaration_key: Key built as legislature-cadastro_id-n, n counting the person's declarations in the file.
      cadastro_id: Person id (cadId, RecordId or IdCadastroGODE).
      format_version: Format of the record, V1, V2, V3 or V5.
      declaration_id: AR id of the declaration (rgiId or FactoDeclaracao.Id). V3 publishes none.
      declared_legislature: Legislature the declaration names (rgiLegDes or Legislatura). V3 names none, so it is the file's.
      position: Office declared (rgiCargoDes, PositionDesignation or CargoFuncao).
      position_start_raw: Start of the office as published (rgiCargoData, a year, PositionBeginDate or DataInicioFuncao).
      position_changed_raw: Date the office changed as published (PositionChangedDate or DataAlteracaoFuncao).
      position_end_raw: End of the office as published (PositionEndDate or DataCessacaoFuncao).
      version_date_raw: Date of this version of the declaration (rgiDataVersao), V1 and V2 only.
      is_exclusive: Office held in exclusivity (V3 Exclusivity, V5 Exclusividade). Null for V1 and V2.
      items: Number of declared items, one row each in stg_registo_interesses__items.
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_registo_interesses__items:
    description: >-
      One row per declared item, as published. Free-text fields of V1 and V2 (and V1
      activities) become one item each.
    columns:
      declaration_key: Declaration the item belongs to.
      item_number: Position of the item within the declaration.
      category: activity, social_position, society, support, service or other_situation.
      source_list: Published list or field the item comes from, for example rgiCargosSociais or GenCargosMenosTresAnos.
      item_id: AR id of the item, when published.
      type_code: V3 Type code as published (0, 1 or 2), undocumented by the AR.
      description: Activity, office, support, service or situation as written.
      entity: Entity, company or body named.
      nature: Nature of the entity or benefit (V5 Natureza, NaturezaBeneficio).
      activity_area: Area of activity.
      location: Head office or place.
      share: Shareholding as written, for societies.
      paid_raw: Paid flag as published (S, N, or 0 in V5).
      start_date_raw: Start date as published, a year, a month or a day.
      end_date_raw: End date as published.
      date_raw: Single date or period as published for V5 supports and services.
      legislature: Legislature in Roman numerals, from the file path.
      source_file: Normalised file the row was read from, relative to data/.

  stg_ept_registo_interesses__declarations:
    description: >-
      EpT register of interests (XVI, XVII and the earlier entity 510 declarations), one row
      per stored declaration of a Deputado or Deputada, from data/ept_registo_interesses.
      The first columns match stg_registo_interesses__declarations. Replaced and modified
      versions are kept as their own rows. Private build (#42), not published.
    columns:
      declaration_key: Key built as ept:<EpT declaration id>.
      cadastro_id: Null here; the marts fill it from seed_ept_holders (#47).
      format_version: Always EPT.
      declaration_id: EpT declaration id, the same as source_declaration_id.
      declared_legislature: Null. EpT declarations name a body, not a legislature.
      position: Role as EpT names it, Deputado or Deputada.
      position_start_raw: Office start as published (startDate).
      position_changed_raw: Null. EpT publishes no office change date.
      position_end_raw: Office end as published (endDate).
      version_date_raw: Null. EpT has no version date; see submitted_at.
      is_exclusive: Null. Tab 4 has no exclusivity field.
      items: Number of rows in stg_ept_registo_interesses__items for this declaration.
      legislature: Legislature whose dates hold the office start day in Lisbon, or the submitted day when there is no start. Not taken from the EpT body.
      source_file: Stored file the row was read from, relative to data/.
      source: Always ept.
      source_format: Always EPT.
      source_declaration_id: EpT declaration id.
      ept_holder_id: EpT holder id, joins to seed_ept_holders.
      ept_entity_id: EpT body, 510 (Assembleia da República, XIV to XVI) or 4508 (XVII Legislatura).
      ept_role_id: EpT role, 8 (Deputado) or 232 (Deputada).
      position_start_date: Office start as the Europe/Lisbon day.
      position_changed_date: Null, as position_changed_raw.
      position_end_date: Office end as the Europe/Lisbon day.
      version_date: Null, as version_date_raw.
      declaration_nature: initial, modification, cessation, final, replace or reElection.
      declaration_state: published, replaced or modified (also draft, pendingVerification, notPublished or canceled if EpT lists one).
      supersedes_declaration_id: Declaration this one replaces or modifies (relatedDeclarationId).
      superseded_by_declaration_id: Stored declaration that replaces or modifies this one, if any.
      chain_root_declaration_id: First stored declaration of this one's replace or modify chain.
      submitted_at: Submission time as published (submitedDate).
      submitted_date: Submission as the Europe/Lisbon day.
      is_current: True for the newest published declaration with no successor, per holder, body and role.
      retrieved_at: Dia (Lisboa) em que a declaração foi obtida da EpT. Nulo nas declarações guardadas antes de #45.

  stg_ept_registo_interesses__items:
    description: >-
      One row per tab 4 row of an EpT declaration in stg_ept_registo_interesses__declarations.
      The first columns match stg_registo_interesses__items. Text is trimmed, dates are kept as
      published in the _raw columns and converted to the Europe/Lisbon day.
    columns:
      declaration_key: Declaration the item belongs to.
      item_number: Position of the item within the declaration, sections in tab 4 order.
      category: activity, association, support, service, society or other_situation.
      source_list: Tab 4 section label as EpT shows it.
      item_id: Null. EpT rows have no id.
      type_code: Null. EpT has no type code.
      description: Office, activity, support, service or situation as written.
      entity: Entity, company or body named.
      nature: Nature of a society or of a support or benefit.
      activity_area: Nature and area of activity of the entity.
      location: Head office.
      share: Null. EpT publishes the share as share_value_eur and share_pct.
      paid_raw: Remuneração as published, 1 or 0, undocumented by EpT.
      start_date_raw: Start date as published, UTC.
      end_date_raw: End date as published, UTC.
      date_raw: Date of an other situation as published.
      legislature: Legislature of the declaration.
      source_file: Stored file the row was read from, relative to data/.
      source: Always ept.
      is_paid: Null. EpT does not say what 1 and 0 mean.
      start_date: Start date as the Europe/Lisbon day.
      end_date: End date as the Europe/Lisbon day.
      entity_nipc: Entity NIPC, only when it is a valid company NIPC (9 digits, mod-11 check digit, first digit 5, 6, 8 or 9, or prefix 71, 72, 77 or 79). Null otherwise.
      beneficiary: Beneficiary of a support or benefit as written.
      beneficiary_company: Company of the beneficiary, for supports.
      share_value_eur: Value of the shareholding in euros, as written.
      share_pct: Percentage of the shareholding, as written.
      share_holder: Holder of the shareholding as written.
      is_professional_secrecy: Professional secrecy claimed, for services and other situations.
      observation: Observation of an other situation.

  interest_declarations:
    description: >-
      One row per declaration in the register of interests, XI to XV. XVI and XVII are not in
      the AR open data (declarations moved to the Entidade para a Transparência). Only people on
      the XVII lists are covered, since every file lists those people. Names, spouse, marital
      status, property regime, tax and contact fields are left out; join deputies for names.
    columns:
      legislature: Legislature in Roman numerals, from the file.
      declaration_key: Key of the declaration, joins to interests.
      cadastro_id: Person id, joins to deputies.
      format_version: Published format, V1 (XI), V2 (XII, XIII), V3 (XIV) or V5 (XIV, XV).
      declaration_id: AR id of the declaration. Null for V3, which publishes none.
      position: Office declared, for example Deputado.
      position_start_date: Start of the office, when published as a full date.
      position_changed_date: Date the office changed, when published as a full date.
      position_end_date: End of the office, when published as a full date.
      position_start_raw: Start of the office as published. V1 and V2 publish a year.
      version_date: Date of this version of the declaration, V1 and V2 only.
      is_exclusive: Office held in exclusivity. Null for V1 and V2.
      items: Number of rows in interests for this declaration.

  interests:
    description: >-
      One row per declared interest: activities and offices, social positions, societies,
      supports, services and other situations. Text is as published, so free-text items can
      read "Nada a declarar". The JSON wins over the old mapper: V1 publishes activities as
      one free-text field, and V5 is read too (XIV, XV), since the dump has it.
    columns:
      legislature: Legislature in Roman numerals.
      declaration_key: Declaration, joins to interest_declarations.
      item_number: Position of the item within the declaration.
      cadastro_id: Person id, joins to deputies.
      category: activity, social_position, society, support, service or other_situation.
      source_list: Published list or field the item comes from, for example GenCargosMaisTresAnos.
      item_id: AR id of the item, when published.
      type_code: V3 Type code as published (0, 1 or 2), undocumented by the AR.
      description: Activity, office, support, service or situation as written.
      entity: Entity, company or body named.
      nature: Nature of the entity or benefit, V5 only.
      activity_area: Area of activity.
      location: Head office or place.
      share: Shareholding as written, for societies.
      is_paid: True for S, false for N. Null otherwise, including the 0 V5 publishes.
      start_date: Start date, when published as a full date.
      end_date: End date, when published as a full date.
      start_date_raw: Start date as published, a year, a month or a day.
      end_date_raw: End date as published.
      date_raw: Single date or period as published for V5 supports and services.
