[project]
name = "parlamento-aberto"
version = "0.1.0"
description = "Open data pipeline for the Assembleia da República"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "pyyaml>=6"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=8",
    "ruff>=0.6",
    "xlrd>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
