name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tests/test_upsert.py replays data commits from git history
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  dictionary:
    name: data dictionary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Check docs/dictionary is up to date with schema.yml
        run: uv run python -m parlamento_aberto.dictionary --check

  # Every PR, so it can be a required check: the core source records in the merge result
  # against the base branch (HEAD^1), per legislature. A drop over 5% fails unless the PR
  # acknowledges it in docs/data-changelog.md, as in the data release (#126). A PR that does
  # not touch the lock passes, and so does a push. Only the lock is checked out from data/.
  data-hold:
    name: data-hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            /*
            !/data/
            /data/_meta/sources.lock.json
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Source row drops against base
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "Not a pull request, nothing to compare."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base"
          git show HEAD^1:data/_meta/sources.lock.json > "$RUNNER_TEMP/base/sources.lock.json" \
            || rm -f "$RUNNER_TEMP/base/sources.lock.json"
          git show HEAD^1:docs/data-changelog.md > "$RUNNER_TEMP/base/CHANGELOG.md" || true
          uv run python -m parlamento_aberto.release source-drops --lock data/_meta/sources.lock.json --previous "$RUNNER_TEMP/base"

  # Scans only the commits the PR adds. The full history is scanned weekly on main
  # (gitleaks-full.yml).
  gitleaks:
    name: gitleaks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      # Every commit but no file contents up front: git fetches the blobs base..head
      # needs when gitleaks reads the diff. Only .gitleaks.toml is checked out.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .gitleaks.toml
          sparse-checkout-cone-mode: false
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --redact --verbose --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  file-size:
    name: file size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_file_size.py

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint (with shellcheck)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
